<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Nunito:wght@700&family=Caveat:wght@600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #FBF3E4; font-family: Nunito, sans-serif; position: relative;
    background-image: radial-gradient(circle at 15% 20%, rgba(242,193,78,.25), transparent 45%), radial-gradient(circle at 90% 80%, rgba(200,68,47,.12), transparent 45%);
  }
  .gingham { position: absolute; left: 0; right: 0; height: 26px; background-color: #fff;
    background-image: linear-gradient(90deg, rgba(200,68,47,.55) 50%, transparent 50%), linear-gradient(rgba(200,68,47,.55) 50%, transparent 50%);
    background-size: 52px 52px; }
  .top { top: 0; } .bottom { bottom: 0; }
  .wrap { position: absolute; inset: 26px 0; display: flex; align-items: center; gap: 40px; padding: 0 80px; }
  img { width: 360px; height: 360px; flex: none; }
  h1 { font-family: Fraunces, serif; font-weight: 800; font-size: 86px; line-height: 1; color: #9E2F1F; margin: 0 0 14px; letter-spacing: -1px; }
  .hand { font-family: Caveat, cursive; font-size: 46px; color: #C8442F; margin: 0 0 20px; }
  p { font-size: 32px; color: #4A3226; margin: 0; line-height: 1.3; }
  .stars { font-size: 44px; color: #D7B46A; letter-spacing: 6px; margin-top: 22px; font-weight: 800; }
</style></head>
<body>
  <div class="gingham top"></div>
  <div class="wrap">
    <img src="icon.svg" alt="">
    <div>
      <h1>Find Your Recipe</h1>
      <div class="hand">Stir the pot. Cook the mystery.</div>
      <p>A random recipe from around the world.<br>1 star or 5? You only find out after you cook it.</p>
      <div class="stars">? ? ? ? ?</div>
    </div>
  </div>
  <div class="gingham bottom"></div>
</body></html>
